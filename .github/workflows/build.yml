name: Build

# Verification build for pull requests and pushes. Releases are produced by
# release.yml (semantic-release).

on:
  push:
    branches: [ main, master ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build rootless deb
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: ./.github/actions/setup-theos

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Verify package layout
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls packages/*.deb)
          # macOS runners have no dpkg-deb, so unpack the ar archive with Python
          python3 - "$deb" <<'PY'
          import io, subprocess, sys, tarfile

          deb = sys.argv[1]
          members = subprocess.run(["ar", "t", deb], capture_output=True, text=True, check=True).stdout.split()
          data_name = next(m for m in members if m.startswith("data.tar"))
          blob = subprocess.run(["ar", "p", deb, data_name], capture_output=True, check=True).stdout
          with tarfile.open(fileobj=io.BytesIO(blob)) as archive:
              names = archive.getnames()

          print(f"--- {deb} ({data_name}) ---")
          print("\n".join(names))
          required = (
              "DynamicLibraries/DisableAssistants.dylib",
              "DynamicLibraries/DisableAssistants.plist",
              "PreferenceBundles/DisableAssistants.bundle/Root.plist",
          )
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          if missing:
              sys.exit("missing from package: " + ", ".join(missing))
          print("package layout OK")
          PY

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: com.shin.disableassistants
          path: packages/*.deb
          if-no-files-found: error
